<!doctype html>
<html lang="en">
<head>
  <include src="partials/head.html"></include>

  <meta name="robots" content="noindex">
  <title>Case Files | Omar Results</title>
  <meta name="description" content="Real clients, real numbers. Names redacted, results not.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Case Files | Omar Results">
  <meta property="og:description" content="Real clients, real numbers. Names redacted, results not.">
  <meta property="og:url" content="{{site}}/case-studies">

  <link rel="stylesheet" href="/src/styles/case-studies.css">
  <script type="module" src="/src/case-studies.js"></script>
</head>
<body>
  <a class="skip-link" href="#files">Skip to the case files</a>

  <include src="partials/header.html"></include>

  <main id="main">

    <!-- Hero -->
    <section class="hero files-hero" aria-labelledby="files-title">
      <div class="container">
        <div class="hero__copy">
          <h1 id="files-title" class="hero__title">The <span class="highlight highlight--hero">evidence.</span></h1>
          <p class="lead hero__lead">Real clients, real numbers. Names redacted, results not.</p>
        </div>
      </div>
    </section>

    <!-- The files -->
    <section class="section band band--raised" id="files" aria-label="Case files">
      <div class="container">
        <ul class="dossiers" role="list">

          <li>
            <a class="dossier" href="/case-studies/therapist" data-reveal>
              <span class="dossier__tab">Case 001</span>
              <svg class="dossier__clip" viewBox="0 0 34 90" aria-hidden="true"><path d="M24 14v52a9 9 0 0 1-18 0V12a6.5 6.5 0 0 1 13 0v50" fill="none" stroke="#16262E" stroke-width="5" stroke-linecap="square"/></svg>
              <span class="dossier__stamp" aria-hidden="true">Solved</span>
              <h2 class="dossier__title">A therapist in <span class="redact"><span class="redact__label">REDACTED</span></span></h2>
              <p class="dossier__meta">Google Ads + landing page</p>
              <p class="dossier__stat"><span class="dossier__num">5</span> new clients in 2 months</p>
              <span class="dossier__cta">Open the file <span class="btn__arrow" aria-hidden="true">→</span></span>
            </a>
          </li>

          <li>
            <button class="dossier dossier--locked" type="button" data-cooking data-reveal style="--d:1">
              <span class="dossier__tab">Case 002</span>
              <span class="dossier__stamp dossier__stamp--locked" aria-hidden="true">Classified</span>
              <span class="dossier__title" aria-hidden="true"><span class="dossier__bar"></span> in <span class="dossier__bar dossier__bar--short"></span></span>
              <span class="visually-hidden">Case file 002, not published yet.</span>
              <span class="dossier__meta" aria-hidden="true"><span class="dossier__bar dossier__bar--line"></span></span>
              <span class="dossier__cooking" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h16v3a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6zM2 11h20M9 3.5v4M15 3.5v4"/></svg> Still cooking</span>
              <span class="dossier__cta dossier__cta--locked">Open the file <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
            </button>
          </li>

          <li>
            <button class="dossier dossier--locked" type="button" data-cooking data-reveal style="--d:2">
              <span class="dossier__tab">Case 003</span>
              <span class="dossier__stamp dossier__stamp--locked" aria-hidden="true">Classified</span>
              <span class="dossier__title" aria-hidden="true"><span class="dossier__bar dossier__bar--short"></span> in <span class="dossier__bar"></span></span>
              <span class="visually-hidden">Case file 003, not published yet.</span>
              <span class="dossier__meta" aria-hidden="true"><span class="dossier__bar dossier__bar--line"></span></span>
              <span class="dossier__cooking" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h16v3a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6zM2 11h20M9 3.5v4M15 3.5v4"/></svg> Still cooking</span>
              <span class="dossier__cta dossier__cta--locked">Open the file <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
            </button>
          </li>

        </ul>

        <p class="dossiers__note" role="status" aria-live="polite" data-cooking-note></p>

        <include src="partials/exhibits.html" level="2"></include>
      </div>
    </section>
  </main>

  <include src="partials/footer.html"></include>
</body>
</html>
