<div class="exhibits" data-reveal>
  <h{{level|3}} class="exhibits__title">What the client said</h{{level|3}}>
  <div class="exhibits__grid">
    <figure class="exhibit">
      <span class="exhibit__label">Exhibit A</span>
      <span class="exhibit__pin" aria-hidden="true"></span>
      <a class="exhibit__shot" href="/assets/img/client-chat-1.jpeg" target="_blank" rel="noopener">
        <img src="/assets/img/client-chat-1.jpeg" width="936" height="319" loading="lazy" alt="WhatsApp message from the client: Omar, I just got a new client who said ChatGPT told them about me! I'm sure it's thanks to your great work.">
      </a>
      <figcaption>A new client found her through ChatGPT.</figcaption>
    </figure>
    <figure class="exhibit">
      <span class="exhibit__label">Exhibit B</span>
      <span class="exhibit__pin" aria-hidden="true"></span>
      <a class="exhibit__shot" href="/assets/img/client-chat-2.jpeg" target="_blank" rel="noopener">
        <img src="/assets/img/client-chat-2.jpeg" width="931" height="333" loading="lazy" alt="WhatsApp message from the client: Omar, it's going so great! And I'm sitting here telling my friend how amazing you've been. She said she needs your help and she's absolutely willing to pay you for it. Are you interested?">
      </a>
      <figcaption>The referral, in her words.</figcaption>
    </figure>
  </div>
</div>
